version: 2.1

jobs:
  build:
    macos:
      xcode: 14.2.0 # بيئة ماك حقيقية تحتوي على كل أدوات ومكتبات آبل الرسمية كاملة

    steps:
      - checkout # جلب كودك الأصلي بالكامل من المستودع

      # الخطوة 1: فحص بنية مشروعك تلقائياً وتشغيل التجميع المناسب له
      - run:
          name: Automatically Detect and Compile iOS Dylib
          command: |
            echo "جاري فحص ملفات مشروعك وتحديد طريقة التجميع المناسبة..."
            
            # إذا كان مشروعك يعتمد على نظام Theos ومعه ملف Makefile
            if [ -f Makefile ]; then
              echo "تم رصد ملف Makefile، جاري التجميع باستخدام Theos..."
              export THEOS=/opt/theos
              make package FINALPACKAGE=1 THEOS_DEVICE_ARCHS="arm64"
              
            # إذا كان هناك ملف تجميع تلقائي خاص بك (สคริปต์ / Script)
            elif [ -f compile.sh ]; then
              echo "تم رصد سكربت تجميع خاص بك، جاري تشغيله..."
              chmod +x compile.sh
              ./compile.sh
              
            # التجميع القياسي المباشر إذا كان لديك ملفات كود عادية (.cpp أو .m)
            else
              echo "جاري التجميع القياسي لملفات الكود المتاحة لبنية arm64..."
              FILE_NAME=$(ls *.cpp *.m *.mm 2>/dev/null | head -n 1)
              if [ -z "$FILE_NAME" ]; then
                echo "خطأ: لم يتم العثور على ملفات كود مناسبة في المجلد الرئيسي!"
                exit 1
              fi
              clang -dynamiclib -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -arch arm64 -miphoneos-version-min=14.0 \
              $FILE_NAME -o myLibrary.dylib
            fi

      # الخطوة 2: حفظ الملف الناتج ورفعه لتتمكن من تحميله فوراً
      - store_artifacts:
          path: .
          destination: ios-output-files
