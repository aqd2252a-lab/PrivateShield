name: Compile iOS Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          xcrun -sdk iphoneos clang++ -dynamiclib -arch arm64 -min-ios-version=14.0 PrivateShield.cpp -o PrivateShield.dylib
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Dylib
          path: PrivateShield.dylib
